<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Download App</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, sans-serif;
    background: #101010;
    color: #ffffff;
    text-align: center;
}

.landing-page {
    min-height: 100vh;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 35px 20px;
    cursor: pointer;
}

/* Logo Section */
.logo-section {
    width: 100%;
    margin-top: 25px;
    margin-bottom: 28px;
}

.logo {
    width: 140px;
    height: 140px;
    object-fit: contain;
    border-radius: 20px;
    background: #ffffff;
    padding: 5px;
}

/* App Name */
.app-name {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 12px;
}

/* Description */
.description {
    font-size: 15px;
    line-height: 1.6;
    color: #cccccc;
    max-width: 340px;
    margin-bottom: 28px;
}

/* Download Button */
.download-btn {
    display: block;
    width: 100%;
    max-width: 330px;
    padding: 17px 20px;
    border-radius: 10px;
    background: #16c75a;
    color: #ffffff;
    text-decoration: none;
    font-size: 20px;
    font-weight: bold;
    box-shadow: 0 4px 15px rgba(22, 199, 90, 0.25);
    cursor: pointer;
    margin-bottom: 20px;
}

.download-btn:active {
    transform: scale(0.97);
}

/* Extra Information */
.info {
    font-size: 13px;
    color: #aaaaaa;
    line-height: 1.8;
}

/* Footer */
.footer {
    margin-top: auto;
    padding-top: 45px;
    font-size: 12px;
    color: #777777;
}

/* Small Screens */
@media (max-width: 360px) {
    .logo {
        width: 115px;
        height: 115px;
    }

    .app-name {
        font-size: 24px;
    }

    .download-btn {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<div class="landing-page" id="landingPage">

    <!-- LOGO SECTION -->
    <div class="logo-section">
        <img
            class="logo"
            id="appLogo"
            src="https://placehold.co/300x300/ffffff/111111?text=YOUR+LOGO"
            alt="App Logo"
        >
    </div>

    <!-- APP NAME -->
    <h1 class="app-name" id="appName">Shoper Zone</h1>

    <!-- DESCRIPTION -->
    <p class="description">
        Download the app and follow the instructions
        provided on the official download page.
    </p>

    <!-- DOWNLOAD BUTTON -->
    <a href="https://example.com/download"
       class="download-btn"
       id="downloadButton">
       ⬇ DOWNLOAD NOW
    </a>

    <!-- INFORMATION -->
    <div class="info">
        ✓ Mobile Friendly<br>
        ✓ Easy Access<br>
        ✓ Download Information
    </div>

    <!-- FOOTER -->
    <div class="footer">
        © 2026 Your App Name
    </div>

</div>

<script>
/* ==================================
   EDIT YOUR SETTINGS HERE
================================== */

const APP_CONFIG = {
    appName: "Shoper Zone",

    // Replace with your actual logo image URL
    logoURL: "https://i.ibb.co/NgZJkjmJ/ms-nviqn-512-908386895.jpg",

    // Replace with your actual download destination
    downloadURL: ""
};

/* Apply settings */
document.title = APP_CONFIG.appName + " - Download";

document.getElementById("appName").textContent =
    APP_CONFIG.appName;

document.getElementById("appLogo").src =
    APP_CONFIG.logoURL;

document.getElementById("appLogo").alt =
    APP_CONFIG.appName + " Logo";

document.getElementById("downloadButton").href =
    APP_CONFIG.downloadURL;

/* Whole screen click redirect */
document.getElementById("landingPage").addEventListener(
    "click",
    function(event) {

        // Avoid duplicate handling of the download button
        if (event.target.closest("#downloadButton")) {
            return;
        }

        // Ignore text selection and other unintended clicks
        if (window.getSelection &&
            window.getSelection().toString()) {
            return;
        }

        window.location.href = APP_CONFIG.downloadURL;
    }
);
</script>

</body>
</html>
