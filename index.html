<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Diwa Game Zone</title>


<style>

/* =========================
   BASIC RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================
   BODY
========================= */

body {

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: white;


    background:

        radial-gradient(
            circle at 20% 20%,
            #164d3c 0%,
            transparent 35%
        ),

        radial-gradient(
            circle at 80% 80%,
            #0b5943 0%,
            transparent 35%
        ),

        linear-gradient(
            135deg,
            #020806,
            #071a13,
            #020806
        );
}


/* =========================
   BACKGROUND BUBBLES
========================= */

.bubble {

    position: fixed;

    border-radius: 50%;

    pointer-events: none;

    filter: blur(3px);

    opacity: 0.25;
}


.bubble-1 {

    width: 230px;

    height: 230px;

    background: #16e39a;

    top: -100px;

    left: -80px;
}


.bubble-2 {

    width: 300px;

    height: 300px;

    background: #0b8f69;

    bottom: -140px;

    right: -100px;
}


.bubble-3 {

    width: 120px;

    height: 120px;

    background: #63ffd0;

    top: 15%;

    right: 15%;

    opacity: 0.12;
}


/* =========================
   MAIN CONTAINER
========================= */

.container {

    width: 92%;

    max-width: 430px;

    padding: 45px 25px;

    text-align: center;

    border-radius: 28px;

    background:
        rgba(3, 18, 13, 0.68);

    border:
        1px solid rgba(255,255,255,0.12);

    backdrop-filter:
        blur(15px);

    box-shadow:
        0 20px 70px
        rgba(0,0,0,0.55);

}


/* =========================
   LOGO
========================= */

.logo {

    width: 220px;

    height: 220px;

    object-fit: contain;

    display: block;

    margin: 0 auto 30px;

    filter:
        drop-shadow(
            0px 12px 25px
            rgba(0,0,0,0.5)
        );
}


/* =========================
   DOWNLOAD BUTTON
========================= */

.download-btn {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 10px;

    min-width: 230px;

    padding: 16px 30px;

    border-radius: 50px;

    text-decoration: none;

    color: #03120d;

    font-size: 18px;

    font-weight: bold;

    background:
        linear-gradient(
            135deg,
            #68ffd1,
            #13c98a
        );

    box-shadow:
        0 12px 30px
        rgba(19,201,138,0.30);

    transition: 0.25s;

}


.download-btn:hover {

    transform:
        translateY(-4px);

    box-shadow:
        0 18px 38px
        rgba(19,201,138,0.45);

}


/* =========================
   REDIRECT TIMER
========================= */

.redirect-message {

    margin-top: 22px;

    font-size: 14px;

    color: #b8ccc5;

}


#countdown {

    font-size: 18px;

    font-weight: bold;

    color: #68ffd1;

}


/* =========================
   SMALL TEXT
========================= */

.small-text {

    margin-top: 18px;

    font-size: 12px;

    color: #9db0aa;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    .container {

        padding:
            38px 20px;

    }


    .logo {

        width: 190px;

        height: 190px;

    }


    .download-btn {

        width: 90%;

    }

}

</style>

</head>


<body>


<!-- =========================
     BACKGROUND
========================= -->

<div class="bubble bubble-1"></div>

<div class="bubble bubble-2"></div>

<div class="bubble bubble-3"></div>



<!-- =========================
     MAIN CONTENT
========================= -->

<div class="container">


    <!-- LOGO -->

    <img

        id="logo"

        class="logo"

        src="logo.png"

        alt="Diwa Game Zone"

    >



    <!-- DOWNLOAD BUTTON -->

    <a

        id="downloadButton"

        class="download-btn"

        href="#"

    >

        <span>⬇</span>

        <span id="buttonText">
            Download Now
        </span>

    </a>



    <!-- REDIRECT MESSAGE -->

    <div

        id="redirectMessage"

        class="redirect-message"

    >

        Redirecting in

        <span id="countdown">
            5
        </span>

        seconds...

    </div>



    <!-- SMALL TEXT -->

    <div class="small-text">

        Fast • Simple • Mobile Friendly

    </div>


</div>



<script>

/* =====================================================
   CUSTOMIZE YOUR LANDING PAGE
   ===================================================== */


const SETTINGS = {


    /* ---------------------------------
       LOGO
       ---------------------------------

       Put your logo in the same folder
       as this HTML file.

       Example:

       logo.png

       or

       diwa-logo.png
    */

    logo: "https://i.ibb.co/2YSknDsK/Picsart-26-10-10-08-03-34-408.jpg",



    /* ---------------------------------
       DOWNLOAD BUTTON
       ---------------------------------

       true  = Show button

       false = Hide button
    */

    showDownloadButton: true,



    /* ---------------------------------
       DOWNLOAD LINK
       ---------------------------------

       Put your actual APK/download
       link here.
    */

    downloadURL:
        "https://diwaokshare.vip?pid=294064776&channel=2010001&pkg=com.diwaok.app",



    /* ---------------------------------
       BUTTON TEXT
       --------------------------------- */

    buttonText:
        "Download APK",



    /* ---------------------------------
       AUTOMATIC REDIRECT
       ---------------------------------

       true  = Enable redirect

       false = Disable redirect
    */

    enableAutoRedirect: true,



    /* ---------------------------------
       REDIRECT TIME

       Time is in seconds.

       Example:

       5  = 5 seconds

       10 = 10 seconds

       15 = 15 seconds

       30 = 30 seconds
    */

    redirectTime: 3,



    /* ---------------------------------
       PAGE TITLE
       --------------------------------- */

    pageTitle:
        "Diwa Om"

};


/* =====================================================
   DO NOT CHANGE BELOW THIS LINE
===================================================== */


/* Page title */

document.title =
    SETTINGS.pageTitle;



/* =========================
   LOGO
========================= */

const logo =
    document.getElementById("logo");

logo.src =
    SETTINGS.logo;



/* =========================
   DOWNLOAD BUTTON
========================= */

const downloadButton =
    document.getElementById(
        "downloadButton"
    );


const buttonText =
    document.getElementById(
        "buttonText"
    );


if (
    SETTINGS.showDownloadButton
    === true
) {

    downloadButton.style.display =
        "inline-flex";


    downloadButton.href =
        SETTINGS.downloadURL;


    buttonText.innerText =
        SETTINGS.buttonText;

}

else {

    downloadButton.style.display =
        "none";

}



/* =========================
   REDIRECT ELEMENTS
========================= */

const redirectMessage =
    document.getElementById(
        "redirectMessage"
    );


const countdown =
    document.getElementById(
        "countdown"
    );



/* =========================
   AUTOMATIC REDIRECT
========================= */

if (
    SETTINGS.enableAutoRedirect
    === true
) {


    /* Show message */

    redirectMessage.style.display =
        "block";


    /* Starting time */

    let timeLeft =
        SETTINGS.redirectTime;


    countdown.innerText =
        timeLeft;



    /* Countdown */

    const timer =
        setInterval(function() {


            timeLeft--;


            countdown.innerText =
                timeLeft;



            /* Redirect */

            if (
                timeLeft <= 0
            ) {

                clearInterval(timer);


                window.location.href =
                    SETTINGS.downloadURL;

            }


        }, 1000);

}

else {


    /* Hide redirect message */

    redirectMessage.style.display =
        "none";

}



/* =====================================================
   FULL PAGE CLICK REDIRECT
===================================================== */


/*
   Clicking anywhere on the page
   will open the download link.
*/


document.addEventListener(
    "click",
    function(event) {


        /*
           Prevent duplicate redirect
           when clicking the actual
           download button.
        */

        if (
            event.target.closest(
                "#downloadButton"
            )
        ) {

            return;

        }


        /*
           Open download link
        */

        window.location.href =
            SETTINGS.downloadURL;


    }
);

</script>


</body>
</html>
