<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Diwa Game Zone</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: Arial, sans-serif;

    background:
        radial-gradient(circle at 20% 20%, #164d3c 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #0b5943 0%, transparent 35%),
        linear-gradient(135deg, #020806, #071a13, #020806);

    color: white;
}

/* Background bubbles */
.bubble {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    filter: blur(3px);
    opacity: 0.25;
}

.bubble-1 {
    width: 230px;
    height: 230px;
    background: #16e39a;
    top: -100px;
    left: -80px;
}

.bubble-2 {
    width: 300px;
    height: 300px;
    background: #0b8f69;
    bottom: -140px;
    right: -100px;
}

.bubble-3 {
    width: 120px;
    height: 120px;
    background: #63ffd0;
    top: 15%;
    right: 15%;
    opacity: 0.12;
}

/* Main box */
.container {
    width: 92%;
    max-width: 430px;

    padding: 45px 25px;

    text-align: center;

    border-radius: 28px;

    background: rgba(3, 18, 13, 0.68);

    border: 1px solid rgba(255,255,255,0.12);

    backdrop-filter: blur(15px);

    box-shadow:
        0 20px 70px rgba(0,0,0,0.55);
}

/* Logo */
.logo {
    width: 220px;
    height: 220px;

    object-fit: contain;

    display: block;

    margin: 0 auto 30px;

    filter:
        drop-shadow(0px 12px 25px rgba(0,0,0,0.5));
}

/* Download button */
.download-btn {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 10px;

    min-width: 230px;

    padding: 16px 30px;

    border-radius: 50px;

    text-decoration: none;

    color: #03120d;

    font-size: 18px;

    font-weight: bold;

    background: linear-gradient(
        135deg,
        #68ffd1,
        #13c98a
    );

    box-shadow:
        0 12px 30px rgba(19,201,138,0.30);

    transition: 0.25s;
}

.download-btn:hover {
    transform: translateY(-4px);

    box-shadow:
        0 18px 38px rgba(19,201,138,0.45);
}

/* Small text */
.small-text {
    margin-top: 20px;

    font-size: 12px;

    color: #9db0aa;
}


/* Mobile */
@media (max-width: 500px) {

    .container {
        padding: 38px 20px;
    }

    .logo {
        width: 190px;
        height: 190px;
    }

    .download-btn {
        width: 90%;
    }
}
</style>

</head>

<body>

<!-- Background bubbles -->
<div class="bubble bubble-1"></div>
<div class="bubble bubble-2"></div>
<div class="bubble bubble-3"></div>


<div class="container">

    <!-- LOGO -->
    <img
        id="logo"
        class="logo"
        src="logo.png"
        alt="New New New "
    >


    <!-- DOWNLOAD BUTTON -->

    <a
        id="downloadButton"
        class="download-btn"
        href="#"
    >
        <span>⬇</span>
        <span id="buttonText">Download Now</span>
    </a>


</div>


<script>

/* =====================================================
   CUSTOMIZE YOUR LANDING PAGE HERE
   ===================================================== */

const SETTINGS = {

    /* Logo file name */
    logo: "https://i.ibb.co/NgZJkjmJ/ms-nviqn-512-908386895.jpg",


    /* 
       Download button:
       true  = Show button
       false = Hide button
    */
    showDownloadButton: false,


    /* Your download link */
    downloadURL: "https://example.com/download.apk",


    /* Button text */
    buttonText: "Download APK",


    /* Browser title */
    pageTitle: "Diwa Game Zone - Download"

};


/* =====================================================
   DO NOT CHANGE BELOW
   ===================================================== */

document.title = SETTINGS.pageTitle;


/* Set logo */
document.getElementById("logo").src = SETTINGS.logo;


/* Download button */
const downloadButton =
    document.getElementById("downloadButton");


if (SETTINGS.showDownloadButton === true) {

    downloadButton.style.display = "inline-flex";

    downloadButton.href =
        SETTINGS.downloadURL;

    document.getElementById("buttonText")
        .innerText =
        SETTINGS.buttonText;

} else {

    /* Hide download button */
    downloadButton.style.display = "none";

}

</script>

</body>
</html>
