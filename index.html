      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 12px 60px 12px;

       ==================================================================== */
    header {

      font-weight: 800;

      text-transform: uppercase;

    .brand-title span {
      color: var(--primary-red);

      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 22px;

    .video-card {

      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);

    }

    .video-card:hover {
      border-color: rgba(229, 9, 20, 0.6);
      box-shadow: 0 6px 20px var(--accent-red-glow);
    }

    .card-title-header {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.35;
    }

       THUMBNAIL & PREVIEW PLAYER
       ==================================================================== */
    .media-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #050505;
      overflow: hidden;
      cursor: pointer;
    }

    .media-thumb,
    .media-preview-video,
    .media-preview-gif {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: filter 0.3s ease, opacity 0.3s ease;
    }

    .media-wrapper.is-loading .media-thumb {
      filter: blur(8px);
    }

      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      background-color: #000;
      z-index: 2;

      display: block;

      left: 50%;

      height: 54px;
      background: rgba(229, 9, 20, 0.85);
      border-radius: 50%;

      align-items: center;
      justify-content: center;

      pointer-events: none;
      transition: transform 0.2s ease, background 0.2s ease;
      z-index: 1;

      gap: 10px;

      font-size: 0.85rem;

      cursor: pointer;

      text-decoration: none;
      text-align: center;

    .btn-watch {

    /* ====================================================================

       ==================================================================== */
    function createVideoCard(video, index) {
      const card = document.createElement("article");
      card.className = "video-card";
      card.id = `video-card-${video.id}`;

      card.innerHTML = `
        <div class="card-title-header">

               loading="lazy"
               onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'640\\' height=\\'360\\' viewBox=\\'0 0 640 360\\'><rect width=\\'640\\' height=\\'360\\' fill=\\'%231a1a1a\\'/><text x=\\'50%\\' y=\\'50%\\' fill=\\'%23555\\' font-family=\\'sans-serif\\' font-size=\\'20\\' text-anchor=\\'middle\\' dy=\\'.3em\\'>Thumbnail Unavailable</text></svg>';">

    function createAdPlaceholder(id, commentText) {

    /* ====================================================================
       PREVIEW PLAYER LOGIC
       Supports both MP4 videos and GIF preview links.
       Previews are ALWAYS muted and will not autoplay sound.
       ==================================================================== */
    function handleThumbnailClick(wrapper, video) {
      const container = wrapper.querySelector(".preview-player-container");

      // Toggle off if already active
      if (container.classList.contains("active")) {
        closePreview(wrapper, container);
        return;
      }

      // Add temporary blur effect to thumbnail while loading
      wrapper.classList.add("is-loading");

      // Check format: GIF vs Video
      const isGif = video.previewUrl.trim().toLowerCase().endsWith(".gif");

      container.innerHTML = ""; // Clear existing

      const closeBtn = document.createElement("button");
      closeBtn.className = "close-preview-btn";
      closeBtn.type = "button";
      closeBtn.textContent = "✕ Close";
      closeBtn.onclick = (e) => {
        e.stopPropagation();
        closePreview(wrapper, container);
      };

      if (isGif) {
        const gifImg = document.createElement("img");
        gifImg.className = "media-preview-gif";
        gifImg.alt = "Preview";
        gifImg.src = video.previewUrl;
        gifImg.onload = () => wrapper.classList.remove("is-loading");
        gifImg.onerror = () => handleMediaError(wrapper, container);

        container.appendChild(closeBtn);
        container.appendChild(gifImg);
        container.classList.add("active");
      } else {
        const videoEl = document.createElement("video");
        videoEl.className = "media-preview-video";
        videoEl.src = video.previewUrl;
        videoEl.muted = true; // Strict: No sound on preview
        videoEl.defaultMuted = true;
        videoEl.autoplay = true;
        videoEl.playsInline = true;
        videoEl.setAttribute("playsinline", "");
        videoEl.setAttribute("webkit-playsinline", "");

        videoEl.onplaying = () => wrapper.classList.remove("is-loading");

        // Restore original thumbnail when video preview finishes
        videoEl.onended = () => closePreview(wrapper, container);

        videoEl.onerror = () => handleMediaError(wrapper, container);

        container.appendChild(closeBtn);
        container.appendChild(videoEl);
        container.classList.add("active");

        const playPromise = videoEl.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            // Autoplay with muted prevented or failed
            wrapper.classList.remove("is-loading");
          });
        }
      }
    }

    function closePreview(wrapper, container) {
      wrapper.classList.remove("is-loading");
      const videoEl = container.querySelector("video");
      if (videoEl) {
        videoEl.pause();
        videoEl.removeAttribute("src");
        videoEl.load();
      }
      container.innerHTML = "";
      container.classList.remove("active");
    }

    function handleMediaError(wrapper, container) {
      wrapper.classList.remove("is-loading");
      closePreview(wrapper, container);
      alert("Video preview is temporarily unavailable. Click Watch Now to view.");
    }

    /* ====================================================================
       POPUNDER & DUAL-CLICK DESTINATION LOGIC
       - Click 1: Lets the official Adsterra popunder listener capture the click,
                  shows subtle visual feedback, without navigating away.
       - Click 2: Safely navigates the user to their target URL.
       - Independent state tracked per button.
       ==================================================================== */
    function attachButtonAction(button) {
      // Each button tracks its own clicked state
      button.dataset.clickedState = "0";

      button.addEventListener("click", function(event) {
        const targetUrl = this.getAttribute("data-url");
        const actionType = this.getAttribute("data-action");
        const currentState = parseInt(this.dataset.clickedState, 10);

        if (!targetUrl || targetUrl === "#" || targetUrl === "") {
          return; // No URL configured
        }

        if (currentState === 0) {
          // FIRST CLICK:
          // The click event naturally bubbles up to 'window' & 'document',
          // allowing Adsterra's popunder script to attach and pop up its ad.
          this.dataset.clickedState = "1";
          this.classList.add("clicked-once");

          const originalText = this.innerHTML;
          if (actionType === "watch") {
            this.innerHTML = "<span>▶ Click to Confirm</span>";
          } else {
            this.innerHTML = "<span>⬇ Click to Download</span>";
          }

          // Safety Reset: If user does not click the 2nd time within 15 seconds,
          // reset state so they are not confused later.
          setTimeout(() => {
            this.dataset.clickedState = "0";
            this.classList.remove("clicked-once");
            this.innerHTML = originalText;
          }, 15000);

        } else {
          // SECOND CLICK:
          // Reset button appearance and safely navigate to target URL.
          this.dataset.clickedState = "0";
          this.classList.remove("clicked-once");

          // Reset button text
          if (actionType === "watch") {
            this.innerHTML = "<span>▶ Watch Now</span>";
          } else {
            this.innerHTML = "<span>⬇ Download</span>";
          }

          // Safe open in a new tab without window.opener vulnerability
          const newWindow = window.open(targetUrl, "_blank", "noopener,noreferrer");
          if (!newWindow) {
            // Popup blocker prevented new tab, fallback to direct navigation
            window.location.href = targetUrl;
          }
        }
      });
    }

    /* ====================================================================
       XSS PROTECTION UTILITY
       ==================================================================== */
    function escapeHTML(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
